name: Build verification container
description: Build the deployable image once, persisting Docker layers and real Cargo cache mounts.
runs:
  using: composite
  steps:
    - name: Set up Buildx
      id: builder
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Restore Cargo container cache
      id: cargo-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/colombo-cargo-cache
        key: colombo-container-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Dockerfile') }}-${{ github.sha }}
        restore-keys: |
          colombo-container-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Dockerfile') }}-
    # BuildKit's GHA layer cache does not preserve RUN cache mounts itself.
    # This post-step extracts mounts before actions/cache saves them.
    - name: Restore BuildKit cache mounts
      uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      with:
        builder: ${{ steps.builder.outputs.name }}
        scratch-dir: ${{ runner.temp }}/colombo-cache-dance
        cache-map: |
          {
            "${{ runner.temp }}/colombo-cargo-cache/registry": "/usr/local/cargo/registry",
            "${{ runner.temp }}/colombo-cargo-cache/target": "/build/target"
          }
        skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit == 'true' }}
    - name: Build deployable image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        builder: ${{ steps.builder.outputs.name }}
        context: .
        load: true
        push: false
        tags: colombo:ci
        cache-from: type=gha,scope=colombo-${{ runner.os }}-${{ runner.arch }}
        cache-to: type=gha,scope=colombo-${{ runner.os }}-${{ runner.arch }},mode=max,ignore-error=true
