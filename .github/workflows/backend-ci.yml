name: Backend CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'Dockerfile'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-deploy.yml'

jobs:
  verify-and-scrape:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: colombo
          POSTGRES_USER: colombo
          POSTGRES_PASSWORD: colombo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U colombo -d colombo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify tests and coverage
        run: ./mvnw -B verify

      - name: Start packaged application
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/colombo
          DATABASE_USER: colombo
          DATABASE_PASSWORD: colombo
          JPA_DDL_AUTO: validate
          FLYWAY_ENABLED: 'true'
          COLOMBO_FTP_ENABLED: 'false'
          COLOMBO_METRICS_TOKEN: ci-metrics-token-123456
          COLOMBO_BUILD_VERSION: ${{ github.sha }}
        run: |
          java -jar target/colombo-0.0.1-SNAPSHOT.jar > application.log 2>&1 &
          echo $! > application.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat application.log
          exit 1

      - name: Validate private Prometheus scrape
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/actuator/prometheus)" = 401
          curl --fail --silent \
            -H 'Authorization: Bearer ci-metrics-token-123456' \
            http://127.0.0.1:8080/actuator/prometheus > metrics.txt
          grep -q '^# HELP colombo_build_identity' metrics.txt
          grep -q '^colombo_build_identity{' metrics.txt
          grep -q '^# HELP colombo_ftp_sessions_active' metrics.txt
          grep -q '^# HELP colombo_upload_queue_depth' metrics.txt
          grep -q '^# HELP colombo_authentication_attempts_total' metrics.txt
          grep -q '^# HELP colombo_upload_events_total' metrics.txt
          grep -q '^# HELP colombo_dependency_request_duration_seconds' metrics.txt
          grep -q '^# HELP colombo_retry_attempts_total' metrics.txt
          ! grep '^colombo_' metrics.txt | grep -Eqi 'device_id|username|assignment_id|filename|bucket|url|exception'
          docker run --rm --entrypoint /bin/promtool -i prom/prometheus:v3.5.0 check metrics < metrics.txt

      - name: Show application log on failure
        if: failure()
        run: cat application.log || true

      - name: Stop application
        if: always()
        run: kill "$(cat application.pid)" || true
