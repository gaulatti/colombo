name: Backend CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Verify PR #{0}', github.event.pull_request.number) ||
      inputs.check_provider && 'Verify AI provider' ||
      format('PR intent review ({0})', github.event.pull_request.number || github.event.issue.number || inputs.pull_request || github.ref_name) }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Metadata only: this event never executes contributor code.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'PR number to reassess; leave empty to run tests on this ref'
        required: false
        type: string
      check_provider:
        description: 'Only check the provider and live review scenarios; never approve or merge'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Schedule the job so GitHub resolves its name, including metadata events.
    # Step and service guards keep those events from running contributor code.
    name: >-
      ${{ (github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.pull_request == '' && !inputs.check_provider)) && 'verify' || 'metadata-only' }}
    env:
      RUST_TEST_THREADS: 4
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: >-
          ${{ (github.event_name == 'pull_request' ||
              (github.event_name == 'workflow_dispatch' && inputs.pull_request == '' && !inputs.check_provider)) && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_USER: colombo
          POSTGRES_PASSWORD: colombo
          POSTGRES_DB: colombo
        ports:
          - 55436:5432
        options: >-
          --health-cmd "pg_isready -U colombo -d colombo"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        if: &verify-code >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.pull_request == '' && !inputs.check_provider)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: *verify-code
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@nightly
        if: *verify-code
        with:
          toolchain: nightly-2026-10-01
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        if: *verify-code
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        if: *verify-code
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Test approval policy
        if: *verify-code
        uses: gaulatti/clouseau@7f92b605731e69b8a7ae51b7c21212ffd943fa97
        with:
          operation: test
      - name: Check out pinned reviewer for consumer integration tests
        uses: actions/checkout@v4
        if: *verify-code
        with:
          repository: gaulatti/clouseau
          ref: 7f92b605731e69b8a7ae51b7c21212ffd943fa97
          path: .clouseau-ci
          persist-credentials: false
      - name: Test workflow routing
        if: *verify-code
        run: |
          npm ci --prefix .github/tests --ignore-scripts --no-audit --no-fund
          npm test --prefix .github/tests
      - name: Rust format and lint
        if: *verify-code
        run: |
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked --all-targets --all-features -- -D warnings
      - name: Run all targets with branch instrumentation
        if: *verify-code
        id: coverage
        run: |
          cargo +nightly-2026-10-01 llvm-cov clean --workspace
          cargo +nightly-2026-10-01 llvm-cov \
            --locked --all-targets --all-features --branch \
            --no-cfg-coverage --no-cfg-coverage-nightly \
            --json --output-path coverage.json
      - name: Run documentation tests
        if: *verify-code
        run: cargo +1.98.0 test --locked --doc --all-features
      - name: Enforce 100% line and branch coverage
        if: *verify-code
        uses: gaulatti/clouseau@7f92b605731e69b8a7ae51b7c21212ffd943fa97
        with:
          operation: coverage
          coverage-report: coverage.json
          source-directory: src
      - name: Build verification container
        if: *verify-code
        uses: ./.github/actions/build-container
      - name: Verify container boundary
        if: *verify-code
        env:
          COLOMBO_TEST_IMAGE: colombo:ci
          COLOMBO_E2E_SKIP_BUILD: '1'
        run: ./tests/e2e.sh
      - name: Retain coverage evidence
        if: >-
          always() && (github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.pull_request == '' && !inputs.check_provider)) &&
          steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.json
          if-no-files-found: error

  assess-intent:
    if: github.event_name == 'pull_request_target' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
    outputs:
      assessment: ${{ steps.assess.outputs.assessment }}
    steps:
      # Never load the controller or its configuration from the PR.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: gaulatti/clouseau@7f92b605731e69b8a7ae51b7c21212ffd943fa97
        id: assess
        with:
          operation: assess
          wait-for-verification: 'true'
          provider-key: ${{ secrets.DEEPSEEK_API_KEY }}

  approve-and-merge:
    name: ${{ github.event_name == 'pull_request_target' && !github.event.pull_request.draft && 'approve-and-merge' || 'metadata-only-approval' }}
    needs: assess-intent
    # Always resolve the job name; only trusted, ready PR events run its steps.
    # A failed assessment must still fail the required native approval check.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    concurrency:
      group: pr-approval-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Require a completed assessment
        if: >-
          github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
          needs.assess-intent.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        if: &approve-code github.event_name == 'pull_request_target' && !github.event.pull_request.draft
        with:
          ref: main
          persist-credentials: false
      - if: *approve-code
        uses: gaulatti/clouseau@7f92b605731e69b8a7ae51b7c21212ffd943fa97
        with:
          operation: gate
          native-gate: 'true'
          assessment: ${{ needs.assess-intent.outputs.assessment }}

  finalize-merge:
    needs: [assess-intent, approve-and-merge]
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: gaulatti/clouseau@7f92b605731e69b8a7ae51b7c21212ffd943fa97
        with:
          operation: finalize
          assessment: ${{ needs.assess-intent.outputs.assessment }}

  request-reassessment:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve-intent ')) ||
      (github.event_name == 'workflow_dispatch' && inputs.pull_request != '' && !inputs.check_provider)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: gaulatti/clouseau@7f92b605731e69b8a7ae51b7c21212ffd943fa97
        with:
          operation: request-reassessment
          pull-request: ${{ inputs.pull_request }}

  check-provider:
    if: github.event_name == 'workflow_dispatch' && inputs.check_provider
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions: {}
    steps:
      - uses: gaulatti/clouseau@7f92b605731e69b8a7ae51b7c21212ffd943fa97
        with:
          operation: check-provider
          provider-key: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Evaluate repository fit and test integrity with the live model
        uses: gaulatti/clouseau@7f92b605731e69b8a7ae51b7c21212ffd943fa97
        with:
          operation: evaluate-review
          provider-key: ${{ secrets.DEEPSEEK_API_KEY }}
